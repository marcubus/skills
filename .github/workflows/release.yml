name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches VERSION and CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cat VERSION)
          echo "tag=$tag version=$version"
          if [[ -z $version || $tag != "$version" ]]; then
            echo "tag and VERSION disagree" >&2
            exit 1
          fi
          if ! grep -q "## \[$tag\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $tag" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
