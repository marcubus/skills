name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches VERSION and CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(cat VERSION)
          echo "tag=$tag version=$version"
          if [[ -z $version || $tag != "$version" ]]; then
            echo "tag and VERSION disagree" >&2
            exit 1
          fi
          if ! grep -q "## \[$tag\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $tag" >&2
            exit 1
          fi

      # A tag can be pushed more than once by a retry or a force update.
      # Create the release once; later runs leave the existing one in place.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; nothing to do"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
